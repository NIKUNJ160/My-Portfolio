name: Production Deployment

on:
  push:
    branches:
      - main   # single canonical branch — never deploy from master

# Prevent parallel deploys racing on the same Worker
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # ── 1. Quality gates ─────────────────────────────────────────────────────────
  quality:
    name: Typecheck & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build   # tsc --noEmit

      - name: Security Audit
        # Fail the pipeline on high/critical npm vulnerabilities
        run: npm audit --audit-level=high

  # ── 2. D1 schema migration ────────────────────────────────────────────────────
  migrate:
    name: Migrate D1 Schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: quality          # only migrate if code is clean

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Apply schema to production D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # schema.sql uses CREATE TABLE IF NOT EXISTS — safe to re-run on every deploy.
          # Add ALTER TABLE statements as separate migration files when schema evolves.
          command: d1 execute portfolio-db --remote --file=schema.sql

  # ── 3. Deploy Worker ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality, migrate]   # only deploy after gates + migration pass

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      - name: Record deployment metadata
        if: success()
        run: |
          echo "## ✅ Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To roll back: run the **Rollback Production** workflow or" >> $GITHUB_STEP_SUMMARY
          echo "run \`wrangler deployments list\` then \`wrangler rollback <deployment-id>\`." >> $GITHUB_STEP_SUMMARY
